services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      # localhost only — public access goes through Traefik/Dokploy (TLS) or Tailscale.
      # Traefik reaches the container over the docker network, not this port binding.
      - "127.0.0.1:3000:3000"
    environment:
      DATA_DIR: /data
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      DASHBOARD_MASTER_KEY: ${DASHBOARD_MASTER_KEY}
      TZ: ${TZ:-UTC}
    volumes:
      - data:/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATA_DIR: /data
      DASHBOARD_MASTER_KEY: ${DASHBOARD_MASTER_KEY}
      TZ: ${TZ:-UTC}
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
